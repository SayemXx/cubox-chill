[package]
name = "moviebox-mobile"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[dependencies]
moviebox-tui = { path = "../vendor/moviebox-tui" }
jni = "0.21.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
[profile.release]
strip = true
lto = "thin"
panic = "unwind"
