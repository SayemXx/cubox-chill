[package]
name = "cubox-ios"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
moviebox-tui = { path = "../../vendor/moviebox-tui" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[profile.release]
lto = "thin"
panic = "unwind"
